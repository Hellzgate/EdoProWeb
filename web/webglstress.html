<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL stress</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px monospace}#out{padding:8px;white-space:pre-wrap}canvas{display:block;width:100%;height:55vh;background:#000}</style>
<canvas id="c"></canvas>
<pre id="out">start</pre>
<script>
var out = document.getElementById('out');
function log(t) { out.textContent += "\n" + t; }
function info() {
  var gl = document.getElementById('c').getContext('webgl');
  var d = gl.getExtension('WEBGL_debug_renderer_info');
  log('renderer ' + (d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
  log('max texture ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + ' viewport ' + gl.getParameter(gl.MAX_VIEWPORT_DIMS));
}

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl', { alpha: false, depth: true, stencil: true, antialias: false, preserveDrawingBuffer: false });
if (!gl) { log('webgl NULL'); throw new Error('no webgl'); }
info();

// 셰이더 + 풀스크린 쿼드
var vs = gl.createShader(gl.VERTEX_SHADER);
gl.shaderSource(vs, 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }');
gl.compileShader(vs);
var fs = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(fs, 'precision mediump float; void main(){ gl_FragColor = vec4(0.2,0.6,0.9,1.0); }');
gl.compileShader(fs);
var prog = gl.createProgram();
gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { log('link fail ' + gl.getProgramInfoLog(prog)); throw new Error('link'); }
gl.useProgram(prog);
var buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
var loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// 텍스처를 점점 많이 할당 (게임은 스킨/카드 텍스처를 여러 장 올린다)
var texs = [];
var SIZE = 1024;   // 4MB each (RGBA)
var MAX = 64;      // 256MB 까지 시도
var i = 0;
function step() {
  if (i >= MAX) { log('done: ' + texs.length + ' textures, ' + (texs.length * 4) + 'MB'); return; }
  try {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    texs.push(t);
    i++;
    gl.clearColor(0.1, 0.5, 0.8, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (i % 4 === 0) log('alloc ' + i + ' (' + (i * 4) + 'MB) err=' + gl.getError());
    if (navigator.sendBeacon) try { navigator.sendBeacon('/api/jlog?m=' + encodeURIComponent('STRESS ' + i + ' textures')); } catch (e) {}
    setTimeout(step, 16);
  } catch (e) { log('EX at ' + i + ': ' + e); }
}
step();
</script>
