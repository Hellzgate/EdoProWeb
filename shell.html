<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Project Ignis: EDOPro</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  /* CSS 로 확대하면 마우스 좌표가 어긋나므로 원본 크기(1024x640)로 표시한다 */
  #canvas {
    display: block; width: 1024px; height: 640px; max-width: 100vw; max-height: 100vh;
    background: #000; outline: none; cursor: default;
  }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #0d0f14; color: #c9d1d9; font: 14px/1.5 system-ui, sans-serif;
    transition: opacity .25s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #2a2f3a; border-top-color: #4aa3ff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div id="loading"><div id="spinner"></div><div id="status">EDOPro 준비 중…</div></div>
<canvas id="canvas" width="1024" height="640" tabindex="-1"></canvas>
<script>
  var Module = {
    arguments: ['-i-want-to-be-admin'],
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.log(t); },
    setStatus: function (t) {
      var el = document.getElementById('status');
      if (el && t) el.textContent = t;
    }
  };

  // 서버가 /ws?host=&port= 로 TCP 중계 (게임의 libevent 대체)
  window.EDOPRO_WS_BASE = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

  function hideLoading() {
    var l = document.getElementById('loading');
    if (l) l.classList.add('hidden');
  }
  window.addEventListener('load', function () { setTimeout(hideLoading, 800); });

  // 저장소(repositories) 를 받아 MEMFS 에 풀어놓고 시작한다 (main 실행 전 = preRun)
  Module.preRun = [function () {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/repos.tar', false);
      xhr.responseType = 'arraybuffer';
      xhr.send(null);
      if (xhr.status === 200 && xhr.response && xhr.response.byteLength > 1024) {
        extractTar(new Uint8Array(xhr.response));
        console.log('[boot] repositories mounted');
      }
    } catch (e) { console.warn('[boot] repos skip', e); }
  }];

  function extractTar(u8) {
    var off = 0, n = u8.length;
    var decoder = new TextDecoder();
    while (off + 512 <= n) {
      var name = decoder.decode(u8.subarray(off, off + 100)).replace(/\0.*$/, '');
      if (!name) break;
      var sizeStr = decoder.decode(u8.subarray(off + 124, off + 136)).replace(/\0.*$/, '').trim();
      var size = parseInt(sizeStr, 8) || 0;
      var type = u8[off + 156];
      var prefix = decoder.decode(u8.subarray(off + 345, off + 500)).replace(/\0.*$/, '');
      var path = prefix ? prefix + '/' + name : name;
      var dataOff = off + 512;
      if (type === 0 || type === 48 || type === 0) {
        var dir = path.split('/').slice(0, -1).join('/');
        if (dir) { try { Module.FS.mkdirTree(dir); } catch (e) {} }
        try { Module.FS.writeFile(path, u8.subarray(dataOff, dataOff + size)); } catch (e) {}
      } else if (type === 53) {
        try { Module.FS.mkdirTree(path); } catch (e) {}
      }
      off = dataOff + Math.ceil(size / 512) * 512;
    }
  }
</script>
{{{ SCRIPT }}}
</body>
</html>
