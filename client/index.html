<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b120f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EDOPro Web — 듀얼</title>
    <style>
      :root {
        color-scheme: dark;
        /* EDOPro 클라이언트와 같은 중성 다크 + 금색 액센트 */
        --bg: #0c0d0f;
        --surface: #15171a;
        --raised: #1b1e22;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);
        --fg: #eceff2;
        --fg2: #a8b0ba;
        --muted: #737c88;
        --gold: #e8c87a;
        --gold-dim: rgba(232, 200, 122, 0.35);
        --me: #79d6be;
        --foe: #e68c96;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(120% 80% at 50% 0%, #12211a 0%, var(--bg) 62%);
        color: var(--fg);
        font: 14px/1.55 system-ui, 'Malgun Gothic', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }

      header {
        display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        padding: 12px 24px; border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px);
        background: rgba(12, 13, 15, 0.88);
      }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
      header h1 b { color: var(--gold); font-weight: 600; }
      .tag { font-size: 12px; color: var(--muted); }

      nav {
        display: flex; gap: 2px; padding: 0 24px;
        border-bottom: 1px solid var(--line); background: rgba(21, 23, 26, 0.75);
        position: sticky; top: 49px; z-index: 4; overflow-x: auto;
      }
      nav .tab {
        appearance: none; background: transparent; border: 0; border-bottom: 2px solid transparent;
        border-radius: 0; min-height: 40px; padding: 10px 14px; color: var(--fg2);
        font: inherit; font-size: 13.5px; cursor: pointer;
      }
      nav .tab:hover { color: var(--fg); }
      nav .tab.active { color: var(--fg); border-bottom-color: var(--gold); }

      main { padding: 20px 24px 48px; max-width: 1440px; margin: 0 auto; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

      button {
        font: inherit; font-size: 13px; min-height: 34px; padding: 6px 14px;
        border-radius: 9px; border: 1px solid var(--line-strong);
        background: var(--raised); color: var(--fg); cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }
      button:hover { background: #23272c; border-color: rgba(242, 234, 214, 0.24); }
      button:focus-visible { outline: 2px solid var(--gold-dim); outline-offset: 2px; }
      button.primary {
        background: var(--fg); color: #101a15; border-color: var(--fg); font-weight: 600;
      }
      button.primary:hover { background: #fffaea; }
      button[disabled] { opacity: 0.4; cursor: default; }
      input[type='file'] { font-size: 12.5px; color: var(--fg2); max-width: 200px; }
      input[type='text'], select {
        font: inherit; font-size: 13px; min-height: 34px; padding: 6px 10px;
        border-radius: 9px; background: var(--surface); color: var(--fg);
        border: 1px solid var(--line-strong);
      }
      input[type='range'] { flex: 1; min-width: 180px; accent-color: var(--gold); }

      .panel {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 16px;
      }
      .panel > b, .panel-title {
        display: block; font-size: 12px; font-weight: 500; color: var(--muted);
        letter-spacing: 0.02em; margin-bottom: 10px;
      }
      .kv {
        display: flex; justify-content: space-between; gap: 12px; font-size: 13px;
        padding: 6px 0; border-bottom: 1px solid var(--line);
      }
      .kv:last-child { border-bottom: 0; }
      .kv b { color: var(--muted); font-weight: 500; }
      .kv span { font-variant-numeric: tabular-nums; color: var(--fg); }

      #stage {
        position: relative; border-radius: var(--radius); overflow: hidden;
        background: #05070a url('/theme/bg.png') center/cover no-repeat;
      }
      #gl, #fx { position: absolute; left: 0; top: 0; display: block; }
      .hidden { display: none !important; }

      /* ---------- 로컬 듀얼 ---------- */
      .duel-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
      @media (max-width: 1080px) { .duel-wrap { grid-template-columns: minmax(0, 1fr); } }

      #d-stage {
        position: relative; border-radius: var(--radius); overflow: hidden;
        background: #05070a url('/theme/bg.png') center/cover no-repeat; border: 1px solid var(--line);
      }
      #d-gl, #d-fx { position: absolute; left: 0; top: 0; display: block; }
      #d-zoom {
        position: absolute; width: 196px; max-height: 78%; object-fit: contain;
        border-radius: 8px; border: 1px solid rgba(232,200,122,0.5);
        box-shadow: 0 8px 28px rgba(0,0,0,0.6); pointer-events: none;
        opacity: 0; transition: opacity 90ms ease; background: #0a0b0d;
      }
      #d-zoom.on { opacity: 1; }

      .duel-side { display: flex; flex-direction: column; gap: 12px; }
      .d-prompt { display: flex; flex-wrap: wrap; gap: 6px; }
      .d-prompt button { font-size: 12.5px; min-height: 30px; padding: 4px 11px; }
      .d-prompt button[disabled] { opacity: 0.38; cursor: default; }
      .d-prompt .sel-locked { opacity: 0.5; border-style: dashed; }
      .d-prompt .prompt-head { flex: 1 0 100%; font-size: 12px; color: var(--muted); margin-bottom: 2px; }

      .d-log {
        height: 240px; overflow: auto; font-size: 12px; line-height: 1.6; color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .d-log div { padding: 2px 0; border-bottom: 1px solid rgba(242, 234, 214, 0.05); }
      .d-log div:last-child { border-bottom: 0; color: var(--fg); }

      /* 세그먼트(체인 모드) */
      .d-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
      .d-seg button {
        border: 0; border-radius: 0; min-height: 32px; padding: 4px 10px; font-size: 12.5px;
        background: transparent; color: var(--fg2);
      }
      .d-seg button + button { border-left: 1px solid var(--line-strong); }
      .d-seg button.on { background: rgba(232, 200, 122, 0.16); color: var(--gold); font-weight: 600; }
      .d-seg button:hover { background: rgba(255, 255, 255, 0.05); }

      .sort-row { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 12.5px; }
      .sort-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sort-row button { min-height: 24px; padding: 0 8px; }

      /* ---------- 덱 편집기 ---------- */
      .deck-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr); gap: 16px; }
      @media (max-width: 900px) { .deck-wrap { grid-template-columns: minmax(0, 1fr); } }
      .deck-pane, .deck-side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
      .deck-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .deck-bar input[type='text'] { flex: 1; min-width: 140px; }
      .deck-list { position: relative; height: 480px; overflow: auto; border-top: 1px solid var(--line); }
      .deck-viewport { position: relative; }
      .deck-row {
        display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer;
        border-bottom: 1px solid rgba(242, 234, 214, 0.05); font-size: 13px;
      }
      .deck-row:hover { background: rgba(216, 196, 138, 0.06); }
      .deck-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deck-row .m { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
      .deck-row .b { color: var(--fg2); font-size: 11.5px; min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
      .deck-zone { margin-bottom: 12px; }
      .deck-zone header { font-size: 12px; color: var(--muted); padding: 4px 2px 6px; border-bottom: 1px solid var(--line); }
      .deck-zone header b { color: var(--fg); font-variant-numeric: tabular-nums; }
      .deck-zone ul { list-style: none; margin: 0; padding: 0; max-height: 140px; overflow: auto; }
      .deck-zone li { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 2px; font-size: 12.5px; }
      .deck-zone li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deck-zone li button { min-height: 22px; padding: 0 8px; font-size: 12px; line-height: 1; }

      .muted { color: var(--muted); }

      @media (max-width: 720px) {
        header, nav { padding-left: 14px; padding-right: 14px; }
        main { padding: 14px; }
        nav { top: 48px; }
        .panel { padding: 12px; }
        input[type='file'] { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>EDOPro <b>Web</b></h1>
      <span class="tag">유희왕 듀얼 클라이언트</span>
    </header>
    <nav>
      <button class="tab active" data-tab="replay">리플레이</button>
      <button class="tab" data-tab="duel">로컬 듀얼</button>
      <button class="tab" data-tab="deck">덱 편집</button>
      <button class="tab" data-tab="data">데이터</button>
    </nav>
    <main>
      <section id="tab-replay">
        <div class="row">
          <input id="file" type="file" accept=".json,.yrpX,.yrpx" />
          <button id="load" class="primary">열기</button>
          <button id="back">◀</button>
          <button id="play">▶ 재생</button>
          <button id="step">▶|</button>
          <span class="tag">속도 <b id="speedv" class="mono">20</b>/틱</span>
          <input id="speed" type="range" min="1" max="120" value="20" style="max-width: 160px" />
          <span class="tag" id="hint"></span>
        </div>

        <div class="panel" style="margin-bottom: 12px">
          <div class="kv"><b>파일</b><span id="s-file">—</span></div>
          <div class="kv"><b>플레이어</b><span id="s-names">—</span></div>
          <div class="kv"><b>위치 / 전체</b><span id="s-count">—</span></div>
          <div class="kv"><b>LP (P1 / P2)</b><span id="s-lp">—</span></div>
          <div class="kv"><b>승자</b><span id="s-win">—</span></div>
          <div class="kv"><b>마지막 이벤트</b><span id="s-event">—</span></div>
        </div>

        <div class="row">
          <input id="seek" type="range" min="0" max="0" value="0" />
        </div>

        <div id="stage">
          <canvas id="gl"></canvas>
          <canvas id="fx"></canvas>
        </div>
      </section>

      <section id="tab-deck" class="hidden">
        <div id="deck-root"></div>
      </section>
      <section id="tab-duel" class="hidden">
        <div id="duel-root"></div>
      </section>
      <section id="tab-data" class="hidden">
        <div id="data-root"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
