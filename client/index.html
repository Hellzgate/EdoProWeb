<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EDOPro Web — P1 뷰어</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --bg2: #14171c;
        --bg3: #1b1f26;
        --line: rgba(255, 255, 255, 0.08);
        --fg: #e9ecf1;
        --fg2: #a8b0be;
        --muted: #79818f;
        --acc: #6fd3c3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif; }
      header {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 5; min-height: 52px;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .tag { font-size: 11.5px; color: var(--muted); }
      main { padding: 18px 20px 40px; max-width: 1240px; margin: 0 auto; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      button {
        font: inherit; font-size: 13px; min-height: 32px; padding: 6px 13px;
        border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--bg3); color: var(--fg); cursor: pointer;
      }
      button:hover { background: #22272f; }
      button.primary { background: #e9ecf1; color: #12151a; border-color: #e9ecf1; font-weight: 600; }
      input[type='file'] { font-size: 13px; color: var(--fg2); max-width: 220px; }
      .panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
      .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); }
      .kv:last-child { border-bottom: 0; }
      .kv b { color: var(--fg2); font-weight: 500; }
      .kv span { font-variant-numeric: tabular-nums; }
      #stage { position: relative; border-radius: 12px; overflow: hidden; background: #07110f; }
      #gl, #fx { position: absolute; left: 0; top: 0; display: block; }
      input[type='range'] { flex: 1; min-width: 200px; accent-color: var(--acc); }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      nav {
        display: flex; gap: 2px; padding: 0 20px; background: var(--bg2);
        border-bottom: 1px solid var(--line); position: sticky; top: 52px; z-index: 4;
        overflow-x: auto;
      }
      nav .tab {
        background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        min-height: 38px; padding: 9px 14px; color: var(--fg2); font-size: 13.5px;
      }
      nav .tab:hover { background: transparent; color: var(--fg); }
      nav .tab.active { color: var(--fg); border-bottom-color: var(--acc); }
      .hidden { display: none !important; }

      /* 로컬 듀얼 */
      .duel-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.5fr); gap: 14px; }
      @media (max-width: 980px) { .duel-wrap { grid-template-columns: minmax(0, 1fr); } }
      #d-stage { position: relative; border-radius: 12px; overflow: hidden; background: #07110f; }
      #d-gl, #d-fx { position: absolute; left: 0; top: 0; display: block; }
      .duel-side .panel { margin-bottom: 12px; }
      .d-prompt { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .d-prompt button { font-size: 12.5px; min-height: 28px; padding: 4px 10px; }
      .d-prompt button[disabled] { opacity: 0.45; cursor: default; }
      .d-prompt .sel-locked { opacity: 0.55; border-style: dashed; }
      .d-log { height: 260px; overflow: auto; font-size: 12px; line-height: 1.5; color: var(--fg2); }
      .d-log div { border-bottom: 1px solid var(--line); padding: 2px 0; }
      .sort-row { display: flex; align-items: center; gap: 6px; width: 100%; font-size: 12.5px; }
      .sort-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sort-row button { min-height: 24px; padding: 0 8px; }

      /* 덱 편집기 */
      .deck-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr); gap: 14px; }
      @media (max-width: 900px) { .deck-wrap { grid-template-columns: minmax(0, 1fr); } }
      .deck-pane, .deck-side { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .deck-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .deck-bar input[type='text'], .deck-bar select {
        font: inherit; font-size: 13px; min-height: 32px; padding: 5px 10px; border-radius: 8px;
        background: var(--bg3); color: var(--fg); border: 1px solid rgba(255,255,255,.14);
      }
      .deck-bar input[type='text'] { flex: 1; min-width: 140px; }
      .deck-list { position: relative; height: 480px; overflow: auto; border-top: 1px solid var(--line); }
      .deck-viewport { position: relative; }
      .deck-row {
        display: flex; align-items: center; gap: 10px; padding: 0 10px; cursor: pointer;
        border-bottom: 1px solid var(--line); font-size: 13px;
      }
      .deck-row:hover { background: rgba(255,255,255,.04); }
      .deck-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deck-row .m { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
      .deck-row .b { color: var(--fg2); font-size: 11.5px; min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
      .deck-zone { margin-bottom: 10px; }
      .deck-zone header { font-size: 12.5px; color: var(--fg2); padding: 4px 2px; border-bottom: 1px solid var(--line); }
      .deck-zone header b { color: var(--fg); font-variant-numeric: tabular-nums; }
      .deck-zone ul { list-style: none; margin: 0; padding: 0; max-height: 140px; overflow: auto; }
      .deck-zone li { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 2px; font-size: 12.5px; }
      .deck-zone li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deck-zone li button { min-height: 20px; padding: 0 7px; font-size: 12px; line-height: 1; }
      @media (max-width: 720px) {
        main { padding: 12px; }
        .panel { padding: 12px; }
        input[type='file'] { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>EDOPro Web</h1>
      <span class="tag">P1 · ICore + WebGL2 2.5D · 리플레이</span>
    </header>
    <nav>
      <button class="tab active" data-tab="replay">리플레이</button>
      <button class="tab" data-tab="duel">로컬 듀얼</button>
      <button class="tab" data-tab="deck">덱 편집</button>
      <button class="tab" data-tab="data">데이터</button>
    </nav>
    <main>
      <section id="tab-replay">
      <div class="row">
        <input id="file" type="file" accept=".json,.yrpX,.yrpx" />
        <button id="load" class="primary">열기</button>
        <button id="back">◀</button>
        <button id="play">▶ 재생</button>
        <button id="step">▶|</button>
        <span class="tag">속도 <b id="speedv" class="mono">20</b>/틱</span>
        <input id="speed" type="range" min="1" max="120" value="20" style="max-width: 160px" />
        <span class="tag" id="hint"></span>
      </div>

      <div class="panel">
        <div class="kv"><b>파일</b><span id="s-file">—</span></div>
        <div class="kv"><b>플레이어</b><span id="s-names">—</span></div>
        <div class="kv"><b>위치 / 전체</b><span id="s-count">—</span></div>
        <div class="kv"><b>LP (P1 / P2)</b><span id="s-lp">—</span></div>
        <div class="kv"><b>승자</b><span id="s-win">—</span></div>
        <div class="kv"><b>마지막 이벤트</b><span id="s-event">—</span></div>
      </div>

      <div class="row">
        <input id="seek" type="range" min="0" max="0" value="0" />
      </div>

      <div id="stage">
        <canvas id="gl"></canvas>
        <canvas id="fx"></canvas>
      </div>
      </section>

      <section id="tab-deck" class="hidden">
        <div id="deck-root"></div>
      </section>
      <section id="tab-duel" class="hidden">
        <div id="duel-root"></div>
      </section>
      <section id="tab-data" class="hidden">
        <div id="data-root"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
